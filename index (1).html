<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>休生工作台</title>
<meta name="description" content="个人综合工作台：知识库、运营、选品、理财台账、指数跟踪、健康打卡与待办。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000000'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ffd74a'/%3E%3Ccircle cx='50' cy='14' r='5' fill='%23fff3cc'/%3E%3C/svg%3E">
<style>
/* ===== tokens ===== */
:root{
  --bg:#000000;
  --panel:#0d0d0f;
  --panel-2:#131316;
  --line:#26262b;
  --line-soft:#1b1b20;
  --yellow:#ffd74a;
  --yellow-dim:#a78d33;
  --red:#ff0000;
  --flash:#E91E63;
  --text:#eeeeee;
  --muted:#9b9ba3;
  --pink-bg:#fffaea;
  --pink-hover:#fff3cc;
  --pink-active:#ffe89a;
  --pink-line:#f2e6c2;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --radius:14px;
  --font:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--yellow);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--yellow);color:#000}

/* ===== header ===== */
.header{
  position:sticky; top:0; z-index:60;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
}
.top-bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 16px;
}
.brand-area{display:flex; align-items:center; gap:10px; min-width:0}
.hamburger{
  display:none;
  width:40px;height:40px; border-radius:10px;
  background:transparent; border:1px solid var(--line);
  color:var(--yellow); font-size:18px; line-height:1; cursor:pointer;
  align-items:center; justify-content:center;
}
.hamburger:active{background:#1a1a1d}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo-dot{
  width:9px;height:9px;border-radius:50%;background:var(--yellow);flex:none;
  box-shadow:0 0 0 4px rgba(255,215,74,.18);
}
.logo-text{
  color:var(--yellow); font-weight:800; font-size:17px;
  letter-spacing:.12em; white-space:nowrap;
}
.top-right{display:flex;align-items:center;gap:12px;flex:none}
.sync-btn{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 13px;border-radius:999px;
  background:transparent;border:1px solid rgba(255,215,74,.45);
  color:var(--yellow); font-size:12.5px; font-weight:600; cursor:pointer;
  white-space:nowrap;
}
.sync-btn:hover{background:rgba(255,215,74,.1)}
.sync-btn .dot{width:6px;height:6px;border-radius:50%;background:#3d3d44;display:inline-block}
.sync-btn.on .dot{background:var(--yellow);box-shadow:0 0 0 3px rgba(255,215,74,.18)}
.mcp-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.switch{
  position:relative; width:44px; height:23px; border-radius:999px;
  background:#2a2a30; border:none; cursor:pointer; padding:0;
  transition:background .18s ease;
}
.switch::after{
  content:""; position:absolute; top:3px; left:3px; width:17px; height:17px;
  border-radius:50%; background:#8a8a92; transition:left .18s ease,background .18s ease;
}
.switch.on{background:var(--red)}
.switch.on::after{left:24px;background:#ffffff}
.switch:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

.search-top-row{display:flex;gap:8px;padding:0 16px 11px}
.search-input{
  flex:1;min-width:0;height:40px;border-radius:10px;
  background:#111114;border:1px solid var(--line);color:var(--text);
  padding:0 14px;font-size:16px;
}
.search-input::placeholder{color:#6f6f78}
.search-input:focus{outline:none;border-color:var(--yellow);background:#151519}
.search-btn{
  width:44px;height:40px;flex:none;border-radius:10px;
  background:var(--yellow);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.search-btn:hover{background:#ffe377}
.search-btn svg{width:18px;height:18px;fill:none;stroke:#000;stroke-width:2.2}

/* ===== layout / sidebar ===== */
.layout{display:flex;align-items:stretch}
.sidebar{
  width:252px;flex:none;
  background:#ffffff;color:#141416;
  padding:12px 10px 48px;
  min-height:calc(100vh - 110px);
}
#navRoot{display:flex;flex-direction:column;gap:2px}
.group{margin-bottom:2px}
.group-title{
  display:flex;align-items:center;gap:8px;
  width:100%;text-align:left;
  background:transparent;border:none;cursor:pointer;
  padding:9px 8px;border-radius:8px;
  font-size:13.5px;font-weight:700;color:#141416;letter-spacing:.01em;
}
.group-title:hover{background:#fffaea}
.group-arrow{
  font-size:11px;color:#8a7231;width:12px;flex:none;
  transition:transform .16s ease;
}
.group-title .g-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-body{display:flex;flex-direction:column;gap:4px;padding:2px 0 8px 10px}
.group-body.collapsed{display:none}
.sub-item{
  display:block;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--pink-line);background:var(--pink-bg);
  color:#2a2a30;border-radius:8px;padding:7px 9px;
  font-size:12.8px;line-height:1.35;
  transition:background .14s ease,border-color .14s ease;
}
.sub-item:hover{background:var(--pink-hover);border-color:#ecdbac}
.sub-item.active{background:var(--pink-active);border-color:#e2c96e;font-weight:700;color:#141416}
.sub-item .ai-mark{color:#8a7231;font-size:10.5px;margin-left:4px;letter-spacing:.04em}

/* ===== main ===== */
.main{flex:1;min-width:0;padding:24px 18px 72px;max-width:1240px}
.banner{
  border:1px solid #3a2f12;background:#191503;color:#e2c874;
  border-radius:10px;padding:10px 13px;font-size:12.8px;margin-bottom:18px;
}
.banner.warn{border-color:#3a1717;background:#1a0808;color:#f09a9a}

.page-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:16px;
}
.page-head-txt{min-width:0}
.page-title{
  color:var(--yellow);font-size:22px;font-weight:800;letter-spacing:.02em;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.page-sub{color:var(--muted);font-size:12.8px;margin-top:6px;max-width:62ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 15px;border-radius:999px;
  background:var(--yellow);color:#000;font-weight:700;font-size:13px;
  border:1px solid var(--yellow);cursor:pointer;white-space:nowrap;
  transition:background .14s ease,transform .1s ease;
}
.btn:hover{background:#ffe377;border-color:#ffe377}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:rgba(255,215,74,.42);color:var(--yellow);font-weight:600}
.btn.ghost:hover{background:rgba(255,215,74,.1);border-color:rgba(255,215,74,.7)}
.btn.tiny{height:28px;padding:0 11px;font-size:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}

.link-btn{
  background:none;border:none;padding:0;cursor:pointer;
  color:var(--yellow);font-size:12.5px;font-weight:600;text-decoration:underline;
  text-underline-offset:2px;
}

/* filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  height:30px;padding:0 14px;border-radius:999px;cursor:pointer;
  background:#111114;border:1px solid var(--line);color:#c8c8cf;
  font-size:12.8px;
}
.chip:hover{border-color:#3a3a42;color:#fff}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:700}

/* cards */
.cards{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  position:relative;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px 14px;box-shadow:var(--shadow);
  min-width:0;
}
.card:hover{border-color:#34343c}
.card.flash{animation:cardFlash 2.4s ease-out}
@keyframes cardFlash{
  0%{box-shadow:0 0 0 3px var(--flash),var(--shadow)}
  20%{box-shadow:0 0 0 0 rgba(233,30,99,0),var(--shadow)}
  40%{box-shadow:0 0 0 3px var(--flash),var(--shadow)}
  60%{box-shadow:0 0 0 0 rgba(233,30,99,0),var(--shadow)}
  100%{box-shadow:var(--shadow)}
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-title{
  color:var(--yellow);font-size:16px;font-weight:700;line-height:1.4;
  min-width:0;overflow-wrap:anywhere;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.card-actions{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{
  height:26px;padding:0 9px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid #33333b;color:#cfcfd6;
  font-size:11.5px;white-space:nowrap;
}
.icon-btn:hover{border-color:rgba(255,215,74,.5);color:var(--yellow)}
.icon-btn.danger:hover{border-color:#7a2c2c;color:#ff8a8a}

.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;margin:0}
.kv .k{color:var(--muted);font-size:12px;line-height:1.7}
.kv .val,.kv .v{color:#e6e6ea;font-size:13.5px;line-height:1.7;overflow-wrap:anywhere;min-width:0}
.kv.pair{grid-template-columns:1fr}
.kv.pair > div{padding:7px 0;border-top:1px solid var(--line-soft)}
.kv.pair .k{display:block;font-size:11.5px;letter-spacing:.02em}
.kv.pair .v{display:block;margin-top:2px}

.card-body{color:#e6e6ea;font-size:13.5px;line-height:1.75;overflow-wrap:anywhere}
.card-body.clamped p{margin:0 0 6px}
.meta-line{
  display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);
  font-size:11.8px;margin-top:10px;
}
.tag{
  display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
}
.tag.cat{background:rgba(255,215,74,.13);color:var(--yellow);border:1px solid rgba(255,215,74,.32)}
.tag.gold{background:rgba(255,215,74,.13);color:#ffd74a;border:1px solid rgba(255,215,74,.35)}
.tag.blue{background:rgba(25,118,210,.16);color:#7bb4ee;border:1px solid rgba(25,118,210,.4)}
.tag.green{background:rgba(56,142,60,.16);color:#7fc98a;border:1px solid rgba(56,142,60,.4)}
.tag.purple{background:rgba(123,31,162,.18);color:#c79bde;border:1px solid rgba(123,31,162,.45)}
.tag.pending{background:rgba(255,196,0,.13);color:#e5c25c;border:1px solid rgba(255,196,0,.35)}
.tag.hold{background:rgba(255,0,0,.12);color:#ff8b8b;border:1px solid rgba(255,0,0,.32)}
.tag.done{background:rgba(76,175,80,.14);color:#86cf90;border:1px solid rgba(76,175,80,.35)}
.tag.muted{background:#1b1b20;color:#9b9ba3;border:1px solid #2b2b32}

.up{color:#ff6b6b}
.down{color:#4cc28b}
.flat{color:#9b9ba3}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);
  flex-wrap:wrap;
}
.foot-time{color:#7d7d86;font-size:11.5px}
.foot-btns{display:flex;gap:6px;flex-wrap:wrap}

/* empty state */
.empty{
  border:1px dashed #33333b;border-radius:var(--radius);
  padding:34px 20px;text-align:center;color:#8a8a93;font-size:13.2px;
  background:#080809;
}
.empty b{color:var(--yellow);font-weight:700;display:block;margin-bottom:6px;font-size:14px}
.empty .btn{margin-top:14px}

/* checkin table */
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table.checkin{width:100%;border-collapse:collapse;table-layout:fixed}
table.checkin th,table.checkin td{
  padding:11px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--line-soft);
  overflow-wrap:anywhere;
}
table.checkin th{background:#16161a;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.04em}
table.checkin tr:last-child td{border-bottom:none}
table.checkin td.item{font-weight:700;color:#e8e8ec}
table.checkin input[type="text"],
table.checkin input[type="number"]{
  width:100%;height:32px;border-radius:8px;background:#111114;border:1px solid var(--line);
  color:var(--text);padding:0 10px;font-size:16px;
}
table.checkin input:focus{outline:none;border-color:var(--yellow)}
.check-cell{text-align:center}
input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:19px;height:19px;border-radius:5px;border:1px solid #3d3d46;
  background:#111114;cursor:pointer;vertical-align:middle;position:relative;
}
input[type="checkbox"]:checked{background:var(--yellow);border-color:var(--yellow)}
input[type="checkbox"]:checked::after{
  content:"";position:absolute;left:5px;top:2px;width:6px;height:11px;
  border-right:2px solid #000;border-bottom:2px solid #000;transform:rotate(42deg);
}
.cell-tap{display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}

/* summary */
.sum-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.sum-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.sum-card.span2{grid-column:1/-1}
.sum-card h4{color:var(--yellow);font-size:14px;font-weight:700;margin-bottom:6px}
.sum-num{font-size:13.5px;color:#e6e6ea}
.sum-num b{color:var(--yellow);font-size:19px;font-variant-numeric:tabular-nums;padding:0 3px}
.sum-detail{color:#a9a9b2;font-size:12.3px;line-height:1.8;margin-top:6px;white-space:pre-line}

/* forms / modal */
.modal-overlay{
  position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.modal{
  width:min(720px,100%);max-height:88vh;overflow:auto;
  background:#0c0c0e;border:1px solid #2e2e36;border-radius:16px;
  box-shadow:0 30px 80px rgba(0,0,0,.85);padding:20px 20px 18px;
}
.modal.wide{width:min(880px,100%)}
.modal.narrow{width:min(460px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.modal-title{color:var(--yellow);font-size:17px;font-weight:800;line-height:1.4}
.modal-close{
  width:32px;height:32px;border-radius:8px;flex:none;cursor:pointer;
  background:transparent;border:1px solid #33333b;color:#c9c9d1;font-size:15px;line-height:1;
}
.modal-close:hover{border-color:rgba(255,215,74,.5);color:var(--yellow)}
.modal-body{color:#e4e4e9;font-size:14px;line-height:1.85;overflow-wrap:anywhere;white-space:pre-wrap}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.2px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.field input[type="text"],.field input[type="number"],.field input[type="date"],.field input[type="datetime-local"],.field input[type="password"],.field select,.field textarea{
  width:100%;border-radius:9px;background:#111114;border:1px solid #31313a;
  color:var(--text);padding:9px 11px;font-size:16px;line-height:1.5;
}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--yellow);background:#15151a}
.field .hint{color:#71717a;font-size:11.5px;margin-top:4px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}

/* search results */
.res-list{display:flex;flex-direction:column;gap:9px}
.res-item{
  text-align:left;width:100%;cursor:pointer;
  background:#111114;border:1px solid #2a2a32;border-radius:10px;
  padding:10px 12px;color:var(--text);
}
.res-item:hover{border-color:rgba(255,215,74,.55);background:#16161b}
.res-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.res-mod{font-size:10.8px;color:#a78d33;border:1px solid #4a3f1f;background:#1d1a0d;border-radius:999px;padding:1px 7px}
.res-title{font-weight:700;color:var(--yellow);font-size:13.8px}
.res-snip{color:#a6a6ae;font-size:12.4px;line-height:1.65;overflow-wrap:anywhere}

/* toast */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
  background:#15151a;border:1px solid rgba(255,215,74,.45);color:var(--yellow);
  padding:9px 16px;border-radius:999px;font-size:13px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  max-width:88vw;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.6);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.scrim{display:none}
.hint-text{color:#7d7d86;font-size:12px;margin-top:10px;line-height:1.7}
.mono{font-variant-numeric:tabular-nums}

/* ===== responsive ===== */
@media (max-width:768px){
  .header{display:flex;flex-wrap:wrap;padding-bottom:10px}
  .top-bar{display:contents}
  .brand-area{order:1;padding:11px 0 6px 14px}
  .top-right{order:2;margin-left:auto;padding:11px 14px 6px 0;gap:8px}
  .search-top-row{order:3;width:100%;padding:0 14px 2px}
  .hamburger{display:inline-flex}
  .logo-text{font-size:16px;letter-spacing:.08em}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:100;
    width:80vw;max-width:300px;transform:translateX(-102%);
    transition:transform .24s ease;overflow:auto;
    box-shadow:20px 0 50px rgba(0,0,0,.6);
    padding-top:20px;
  }
  .sidebar.open{transform:none}
  .scrim{
    display:block;position:fixed;inset:0;z-index:90;
    background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .scrim.show{opacity:1;pointer-events:auto}
  .main{padding:18px 14px 64px}
  .page-title{font-size:19px}
  .search-btn{height:42px;width:42px}
  .kv{grid-template-columns:1fr}
  .kv .k{font-size:11.5px;margin-top:4px}
  .modal{padding:16px 15px}
  .card{padding:14px 14px 12px}
  table.checkin th,table.checkin td{padding:9px 8px;font-size:12.5px}
}
@media (min-width:769px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .sum-grid{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:1080px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .main{padding:28px 26px 80px}
}
@media (min-width:1440px){
  .main{padding:30px 34px 90px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>

<header class="header">
  <div class="top-bar">
    <div class="brand-area">
      <button class="hamburger" id="hamburger" aria-label="打开导航" aria-expanded="false">☰</button>
      <div class="brand"><span class="logo-dot"></span><span class="logo-text">休生工作台</span></div>
    </div>
    <div class="top-right">
      <button class="sync-btn" id="syncBtn" title="把个人数据备份到自己的 GitHub 仓库"><span class="dot"></span>☁ 同步</button>
      <div class="mcp-wrap">
        <span>MCP</span>
        <button class="switch" id="mcpSwitch" role="switch" aria-checked="false" aria-label="MCP 总开关"></button>
      </div>
    </div>
  </div>
  <div class="search-top-row">
    <input id="globalSearch" class="search-input" type="text" placeholder="全局搜索工作台内容…" autocomplete="off" aria-label="全局搜索">
    <button class="search-btn" id="searchBtn" aria-label="搜索">

/* ---------- 基础工具 ---------- */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2br(s){ return esc(s).replace(/\r?\n/g,'<br>'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return n<10?'0'+n:String(n); }
function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function ymStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function fmtTime(ts){
  if(!ts) return '--';
  var d = new Date(ts);
  if(isNaN(d.getTime())) return String(ts);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDateShort(ts){
  if(!ts) return '--';
  var d = new Date(ts);
  if(isNaN(d.getTime())) return String(ts);
  return (d.getMonth()+1)+'/'+d.getDate();
}
function num(n){
  if(n===null||n===undefined||n===''||isNaN(Number(n))) return '--';
  return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
}
function pct(n){
  if(n===null||n===undefined||n===''||isNaN(Number(n))) return '--';
  var v = Number(n);
  return (v>0?'+':'')+v.toFixed(2)+'%';
}
function clampStr(s,n){ s=String(s==null?'':s); return s.length>n ? s.slice(0,n)+'…' : s; }
function todayCN(){ var d=new Date(); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }

var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); },2200);
}

/* 长文本展开缓存 */

function valHTML(text,id){
  text=String(text==null?'':text);
  if(!text) return '<span style="color:#66666e">--</span>';
  if(text.length<=100) return nl2br(text);
  TEXT_CACHE[id]=text;
  return nl2br(text.slice(0,100))+'… <button class="link-btn" data-act="expand" data-id="'+esc(id)+'">查看全文 ›</button>';
}

function renderGeneric(page){
  var m=MODULES[page];
  var list=Storage.get(m.key,[]);
  var addBtn='<button class="btn" data-act="add" data-page="'+page+'">＋ 新增</button>';
  var head=pageHead(PAGE_META[page].title, PAGE_SUB[page]||'', addBtn);
  if(!list.length){
    return head+emptyState('还没有记录','点右上角「＋ 新增」写下第一条；数据只存在你自己的浏览器里。',addBtn);
  }
  var sorted=list.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  return head+'<div class="cards">'+sorted.map(function(it){ return genericCard(page,it); }).join('')+'</div>';
}

function genericCard(page,it){
  var m=MODULES[page];
  var title=String(it[m.first]||'未命名');
  var tagHTML='';
  if(page==='product-lib' && it.status) tagHTML=tagForStatus(it.status);
  var rows='';
  m.fields.forEach(function(f){
    if(f.k===m.first) return;
    if(f.k==='status' && page==='product-lib') return;
    var raw=it[f.k];
    var display;
    if(f.type==='number') display=num(raw);
    else if(f.type==='textarea') display=valHTML(raw,it.id+'-'+f.k);
    else if(f.type==='select'){
      var label=raw;
      if(f.options){ f.options.forEach(function(o){ if(typeof o==='object' && String(o.v)===String(raw)) label=o.l; }); }
      display=esc(label||'--');
    } else if(f.type==='date'){
      display=esc(raw||'--');
    } else {
      display=esc(raw||'--');
    }
    rows+='<div class="k">'+esc(f.label)+'</div><div class="v">'+display+'</div>';
  });
  return '<article class="card" data-card-id="'+esc(it.id)+'">'+
    '<div class="card-top"><div class="card-title"><span>'+esc(title)+'</span>'+tagHTML+'</div>'+
    cardActions(page,it.id)+'</div>'+
    '<div class="kv">'+rows+'</div>'+
    '<div class="meta-line">创建于 '+fmtTime(it.createdAt)+'</div>'+
  '</article>';
}

function render(){
  var page=currentPage;
  var html;
  if(RENDERERS[page]) html=RENDERERS[page]();
  else if(MODULES[page]) html=renderGeneric(page);
  else html=pageHead(PAGE_META[page].title, PAGE_SUB[page]||'', '');
  view.innerHTML=html;
  updateActiveNav();
}

      '<div class="modal-content">'+bodyHTML+'</div>'+

  ov.addEventListener('click',function(e){ if(e.target.id==='mOverlay') closeModal(); });

function closeModal(){ modalRoot.innerHTML=''; }

function fieldHTML(f,value){
  var id='f_'+f.k;
  var v=value===undefined||value===null?'':value;
  var label='<label for="'+id+'">'+esc(f.label)+(f.req?' <span style="color:#ff8b8b">*</span>':'')+'</label>';
  if(f.type==='textarea'){
    return '<div class="field">'+label+'<textarea id="'+id+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></div>';
  }
  if(f.type==='select'){
    var opts=(f.options||[]).map(function(o){
      var val=typeof o==='object'?o.v:o;
      var lab=typeof o==='object'?o.l:o;
      return '<option value="'+esc(val)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(lab)+'</option>';
    }).join('');
    return '<div class="field">'+label+'<select id="'+id+'">'+opts+'</select></div>';
  }
  if(f.type==='date'){
    return '<div class="field">'+label+'<input id="'+id+'" type="date" value="'+esc(v)+'"></div>';
  }
  if(f.type==='datetime-local'){
    return '<div class="field">'+label+'<input id="'+id+'" type="datetime-local" value="'+esc(v)+'"></div>';
  }
  if(f.type==='password'){
    return '<div class="field">'+label+'<input id="'+id+'" type="password" value="'+esc(v)+'" autocomplete="off"></div>';
  }
  return '<div class="field">'+label+'<input id="'+id+'" type="'+(f.type==='number'?'number':'text')+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"></div>';
}

function openModuleForm(page,id){
  var m=MODULES[page];
  var list=Storage.get(m.key,[]);
  var item=null;
  if(id){ list.forEach(function(x){ if(x.id===id) item=x; }); }
  var data=item||{};
  var sub='';
  if(page==='body-note') sub='<p class="hint">这里只做记录。持续不适或症状加重，请及时就医，不要靠记录自行判断。</p>';
  if(page==='rebalance') sub='<p class="hint">只记录自己的动作与理由，系统不提供任何买卖建议。</p>';
  openModal((item?'编辑':'新增')+' · '+m.title,
    '<div class="grid2">'+m.fields.map(function(f){ return fieldHTML(f,data[f.k]); }).join('')+'</div>'+sub+
    '<div class="modal-foot"><button class="btn ghost" data-act="close-modal">取消</button>'+
    '<button class="btn" data-act="save-module" data-page="'+page+'" data-id="'+esc(id||'')+'">保存</button></div>');
}

function saveModule(page,id){
  var m=MODULES[page];
  var list=Storage.get(m.key,[]);
  var patch={};
  var bad='';
  m.fields.forEach(function(f){
    var el=document.getElementById('f_'+f.k);
    var val=el?el.value.trim():'';
    if(f.req && !val) bad=f.label;
    if(f.type==='number') patch[f.k]=val===''?'':Number(val);
    else patch[f.k]=val;
  });
  if(bad){ toast('「'+bad+'」不能为空'); return; }
  if(id){
    list.forEach(function(x){ if(x.id===id){ for(var k in patch) x[k]=patch[k]; x.updatedAt=Date.now(); } });
  } else {
    patch.id=uid(); patch.createdAt=Date.now();
    list.push(patch);
  }
  Storage.set(m.key,list);
  closeModal(); render(); toast(id?'已保存修改':'已新增');
}

document.addEventListener('click',function(e){
  var nav=e.target.closest('[data-nav]');
  if(nav){ goPage(nav.getAttribute('data-nav')); return; }

});

});

/* ---------- 动作分发 ---------- */
function handleAction(act,el){
  var page=el.getAttribute('data-page');
  var id=el.getAttribute('data-id');
  switch(act){
    case 'add': openModuleForm(page); break;
    case 'edit': openModuleForm(page,id); break;
    case 'del': confirmModuleDel(page,id); break;
    case 'save-module': saveModule(page,id); break;
    case 'ai-fetch': doAIFetch(); break;

    case 'kb-filter': kbFilter=el.getAttribute('data-cat')||'全部'; render(); break;
    case 'kb-paste': openPasteNote(); break;
    case 'kb-gencard': genNoteCard(); break;
    case 'kb-copy': copyOneNote(id); break;
    case 'kb-edit': openNoteForm(id); break;
    case 'kb-del': confirmNoteDel(id); break;
    case 'kb-copy-note': openCopyNoteCat(); break;
    case 'copy-note-all': doCopyNoteCat(); break;
    case 'copy-text': doCopyText(el); break;

    case 'hold-add': openHoldingForm(); break;
    case 'hold-edit': openHoldingForm(id); break;
    case 'hold-save': saveHolding(id); break;
    case 'hold-del': confirmHoldDel(id); break;
    case 'dca': openDca(id); break;
    case 'dca-save': saveDca(id); break;
    case 'refresh-quote': refreshQuotes(); break;

    case 'checkin-save': saveCheckin(); break;
    case 'checkin-summary': render(); toast('本月汇总已更新（纯本地计算）'); break;

    case 'todo-add': openTodoForm(); break;
    case 'todo-edit': openTodoForm(id); break;
    case 'todo-save': saveTodo(id); break;
    case 'todo-toggle': toggleTodo(id); break;
    case 'todo-del': confirmTodoDel(id); break;

    case 'goto': goPage(page,id); closeModal(); break;

    case 'sync-open': openSyncModal(); break;
    case 'sync-save': saveSync(); break;
    case 'sync-push': manualPush(); break;
    case 'sync-pull': manualPull(); break;
    case 'sync-off': disableSync(); break;

    case 'reset-memory-yes': resetMemory(); break;
  }
}

function genNoteCard(){
  var ta=document.getElementById('kbPaste');
  var text=ta?ta.value.trim():'';
  var catEl=document.getElementById('kbCat');
  var category=catEl?catEl.value:'';
  if(!text){ toast('先粘贴内容'); return; }
  var lines=text.split(/\r?\n/);
  var first=lines[0].trim();
  var title=first.length>60?first.slice(0,60)+'…':first;
  var content=(lines.length>1)?lines.slice(1).join('\n').trim():text;
  if(!content) content=first;
  var list=Storage.get('wb_knowledge',[]);
  list.push({ id:uid(), title:title||'未命名笔记', content:content, category:category, createdAt:Date.now() });
  Storage.set('wb_knowledge',list);
  closeModal(); kbFilter='全部'; render(); toast('已生成卡片');
}

function copyText(text,okMsg){
  function done(){ toast(okMsg||'已复制到剪贴板'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text,done); });
  }else{
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text,done){
  var ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}
function copyOneNote(id){
  var n=null;
  Storage.get('wb_knowledge',[]).forEach(function(x){ if(x.id===id) n=x; });
  if(!n) return;
  var text='【'+(n.category||'未分类')+'】'+(n.title||'')+'\n'+(n.content||'');
  copyText(text,'已复制「'+n.title+'」');
}

function holdingCard(h){
  var code=String(h.code||'');
  var q=fundQuote[code]||null;
  var g=(q && q.gszzl!==null && q.gszzl!==undefined && q.gszzl!=='' && !isNaN(Number(q.gszzl)))?Number(q.gszzl):null;
  var amount=(h.amount===''||h.amount==null)?0:Number(h.amount);
  if(isNaN(amount)) amount=0;
  var cost=(h.cost===''||h.cost==null)?null:Number(h.cost);
  var pnl=(cost!==null&&cost>0)?(amount-cost):null;
  var pnlPct=(cost!==null&&cost>0)?((amount-cost)/cost*100):null;
  var today=(g!==null&&amount>0)?(amount*g/100):null;
  var qHTML=(g===null)?'<span class="flat">待刷新</span>'
      :'<span class="'+(g>0?'up':(g<0?'down':'flat'))+'">'+pct(g)+'</span>'+
       (q&&q.dwjz!==undefined?' <span style="color:#8a8a93;font-size:12px">净值 '+esc(q.dwjz)+'</span>':'');
  var todayHTML=(today===null)?'<span class="flat">--</span>'
      :'<span class="'+(today>0?'up':(today<0?'down':'flat'))+'">≈ '+(today>0?'+':'')+'¥'+num(Math.round(today*100)/100)+'</span>';
  var pnlHTML=(pnl===null)?'<span class="flat">--</span>'
      :'<span class="'+(pnl>0?'up':(pnl<0?'down':'flat'))+'">'+(pnl>0?'+':'')+'¥'+num(pnl)+'（'+pct(pnlPct)+'）</span>';
  var typeLabel=TYPE_LABEL[h.type]||TYPE_LABEL.other;
  var dcaLine='';
  if(h.dca && h.dca.enabled){
    dcaLine='<div class="meta-line">定投 每日 ¥'+num(h.dca.daily)+' · 累计 ¥'+num(h.dca.acc||0)+' · 自 '+esc(h.dca.lastDate||'--')+'</div>';
  }
  var upd=(q&&q.gztime)?q.gztime:(h.updatedAt?fmtTime(h.updatedAt):'待刷新');

    '<div class="card-top"><div class="card-title"><span>'+esc(h.name||'未命名')+'</span>'+

    '<div class="kv">'+

      '<div class="k">市值</div><div class="v">¥'+num(amount)+'</div>'+
      '<div class="k">成本</div><div class="v">'+(cost===null?'--':'¥'+num(cost))+'</div>'+
      '<div class="k">持仓盈亏</div><div class="v">'+pnlHTML+'</div>'+
      '<div class="k">今日涨跌</div><div class="v">'+qHTML+'</div>'+
      '<div class="k">今日收益</div><div class="v">'+todayHTML+'</div>'+
    '</div>'+dcaLine+

function saveDca(id){
  var dailyEl=document.getElementById('dcaDaily');
  var onEl=document.getElementById('dcaOn');
  var daily=dailyEl?Number(dailyEl.value):0;
  var on=onEl?onEl.checked:false;
  if(on && (!daily||daily<=0)){ toast('启用定投需要填写大于 0 的金额'); return; }
  var list=Storage.get('wb_asset',[]);
  var t=todayStr();
  list.forEach(function(h){
    if(h.id!==id) return;
    if(!h.dca) h.dca={enabled:false,daily:0,lastDate:'',acc:0};
    var wasOn=!!h.dca.enabled;
    h.dca.enabled=on;
    h.dca.daily=on?daily:(daily||0);
    if(on){
      if(!wasOn || !h.dca.lastDate) h.dca.lastDate=t;
    }
    h.updatedAt=Date.now();
  });
  Storage.set('wb_asset',list);
  closeModal(); render(); toast(on?'定投已启用':'定投已暂停');
}

function applyDCA(){
  var list=Storage.get('wb_asset',[]);
  var t=todayStr();
  var changed=false;
  list.forEach(function(h){
    var d=h.dca;
    if(!d||!d.enabled) return;
    var daily=Number(d.daily)||0;
    if(daily<=0) return;
    if(!d.lastDate){ d.lastDate=t; changed=true; return; }
    var last=new Date(d.lastDate+'T00:00:00');
    if(isNaN(last.getTime())){ d.lastDate=t; changed=true; return; }
    var days=Math.floor((new Date(t+'T00:00:00')-last)/86400000);
    if(days>0){
      if(days>3650) days=3650;
      h.amount=(Number(h.amount)||0)+daily*days;
      d.acc=(Number(d.acc)||0)+daily*days;
      d.lastDate=t;
      changed=true;
    }
  });
  if(changed) Storage.set('wb_asset',list);
}

/* JSONP：东方财富基金估值（顺序加载，避免全局变量串号） */
function loadFundQuote(code){
  return new Promise(function(resolve){
    window.Data_netWorthTrend=undefined;
    window.Data_ACWorthTrend=undefined;
    window.fS_name=undefined;
    var s=document.createElement('script');
    s.src='https://fund.eastmoney.com/pingzhongdata/'+encodeURIComponent(code)+'.js?v='+Date.now();
    s.async=false;
    s.onload=function(){
      var arr=window.Data_netWorthTrend;
      var name=window.fS_name||'';
      var out=null;
      if(arr && arr.length){
        var last=arr[arr.length-1];
        var d=new Date(last.x);
        var g=Number(last.equityReturn);
        out={
          fundcode:code,
          name:name,
          gszzl:isNaN(g)?null:g,
          dwjz:last.y,
          gztime:isNaN(d.getTime())?'':fmtTime(d.getTime())
        };
      }
      if(s.parentNode) s.parentNode.removeChild(s);
      resolve(out);
    };
    s.onerror=function(){
      if(s.parentNode) s.parentNode.removeChild(s);
      resolve(null);
    };
    document.head.appendChild(s);
  });
}

function refreshQuotes(){
  if(!MCP_ON){ toast('MCP 已关闭：先在顶栏打开开关再联网抓取'); return; }
  var list=Storage.get('wb_asset',[]);
  var codes=[];
  list.forEach(function(h){ var c=String(h.code||''); if(/^\d{6}$/.test(c) && codes.indexOf(c)===-1) codes.push(c); });
  if(!codes.length){ toast('台账里没有可抓取的 6 位基金代码'); return; }
  toast('正在顺序抓取 '+codes.length+' 只基金的估值…');
  var i=0, ok=0;
  function next(){
    if(i>=codes.length){
      try{ localStorage.setItem('fundQuoteCache',JSON.stringify(fundQuote)); }catch(e){}
      render();
      toast(ok?('已更新 '+ok+' 只基金估值'):'没有取到估值，可能被接口或网络限制');
      return;
    }
    var code=codes[i++];
    loadFundQuote(code).then(function(q){
      if(q){ fundQuote[code]=q; ok++; }
      setTimeout(next,120);
    });
  }
  next();
}

var PRIORITY={ high:{l:'高',c:'hold',rank:3}, mid:{l:'中',c:'pending',rank:2}, low:{l:'低',c:'muted',rank:1} };

function sortTodoList(list){
  return list.slice().sort(function(a,b){
    var ra=(PRIORITY[a.priority]||{rank:0}).rank;
    var rb=(PRIORITY[b.priority]||{rank:0}).rank;
    if(ra!==rb) return rb-ra;
    var ta=a.time?new Date(a.time).getTime():0;
    var tb=b.time?new Date(b.time).getTime():0;
    if(isNaN(ta)) ta=0;
    if(isNaN(tb)) tb=0;
    if(tb!==ta) return tb-ta;
    return (b.createdAt||0)-(a.createdAt||0);
  });
}

function collectDocs(){
  var docs=[];
  Object.keys(MODULES).forEach(function(page){
    var m=MODULES[page];
    Storage.get(m.key,[]).forEach(function(it){
      var title=String(it[m.first]||'');
      var text=m.fields.map(function(f){
        var v=it[f.k];
        if(v===null||v===undefined) return '';
        if(f.type==='select'&&f.options){
          var lab=v;
          f.options.forEach(function(o){ if(typeof o==='object'&&String(o.v)===String(v)) lab=o.l; });
          if(page==='product-lib'&&f.k==='status') lab=(STATUS_LABEL[v]||v);
          return String(lab);
        }
        return String(v);
      }).join('  ');
      docs.push({ page:page, module:m.title, id:it.id, title:title||'未命名', text:text });
    });
  });
  Storage.get('wb_knowledge',[]).forEach(function(n){
    docs.push({ page:'knowledge-base', module:'知识库笔记', id:n.id, title:n.title||'未命名',
      text:(n.category||'')+' '+(n.content||'') });
  });
  Storage.get('wb_asset',[]).forEach(function(h){
    docs.push({ page:'asset-account', module:'持仓台账', id:h.id, title:h.name||'未命名',
      text:[h.code,TYPE_LABEL[h.type]||'',h.amount,h.cost].join(' ') });
  });
  Storage.get('wb_todo',[]).forEach(function(t){
    docs.push({ page:'todo-list', module:'今日待办', id:t.id, title:t.content||'未命名',
      text:(PRIORITY[t.priority]?PRIORITY[t.priority].l:'')+' '+(t.time||'')+(t.done?' 已完成':'') });
  });
  var recs=Storage.get('checkinRecords',{});
  if(recs && typeof recs==='object' && !Array.isArray(recs)){
    Object.keys(recs).forEach(function(ym){
      var month=recs[ym];
      if(!month || typeof month!=='object') return;
      Object.keys(month).forEach(function(dt){
        var items=month[dt]||{};
        var txt='';
        CHECKIN_ITEMS.forEach(function(it){
          var v=items[it.k];
          if(v && v.checked) txt+=it.name+' '+(v.value||'')+' ';
        });
        if(txt) docs.push({ page:'checkin-history', module:'历史打卡汇总', id:'', title:dt, text:txt });
      });
    });
  }
  (DATA.operationIdeas||[]).forEach(function(n,i){
    docs.push({ page:'operation-ideas', module:'运营思路&选题素材库', id:'op-'+i, title:n.title||'', text:(n.content||'')+' '+(n.url||'')+' '+(n.date||'') });
  });
  (DATA.ideaLib||[]).forEach(function(n,i){
    docs.push({ page:'idea-lib', module:'选题灵感库', id:'idea-'+i, title:n.title||'', text:(n.content||'')+' '+(n.status||'') });
  });
  (DATA.financeNews||[]).forEach(function(n,i){
    docs.push({ page:'finance-news', module:'理财每日新知', id:'fin-'+i, title:n.title||'', text:[n.summary,n.content,n.source,n.date].join(' ') });
  });
  (DATA.indexTrack||[]).forEach(function(n,i){
    var rows=(n.rows||[]).map(function(r){ return (r.label||'')+' '+(r.val||''); }).join(' ');
    docs.push({ page:'index-track', module:'指数跟踪表', id:'idx-'+i, title:n.name||'', text:rows+' '+(n.note||'') });
  });
  return docs;
}

function makeSnippet(text,tokens){
  var low=String(text||'').toLowerCase();
  var pos=-1;
  tokens.forEach(function(t){
    var p=low.indexOf(t);
    if(p>=0 && (pos<0||p<pos)) pos=p;
  });
  if(pos<0) pos=0;
  var start=Math.max(0,pos-26);
  var frag=String(text||'').slice(start,start+86).replace(/\s+/g,' ');
  return (start>0?'…':'')+frag+((start+86)<String(text||'').length?'…':'');
}

function runSearch(q){
  q=String(q||'').trim();
  if(!q) return;
  if(q==='MCP开关-开'){ setMCP(true); toast('MCP 已开启'); return; }
  if(q==='MCP开关-关'){ setMCP(false); toast('MCP 已关闭'); return; }
  if(q==='重置记忆'){ openResetConfirm(); return; }
  if(QUICK[q]){ goPage(QUICK[q]); return; }
  var exact=Object.keys(PAGE_META).filter(function(p){ return PAGE_META[p].title===q; })[0];
  if(exact){ goPage(exact); return; }
  var tokens=q.split(/\s+/).filter(Boolean).map(function(t){ return t.toLowerCase(); });
  var scored=[];
  collectDocs().forEach(function(d){
    var title=String(d.title||'').toLowerCase();
    var body=String(d.text||'').toLowerCase();
    var ok=tokens.every(function(t){ return title.indexOf(t)!==-1 || body.indexOf(t)!==-1; });
    if(!ok) return;
    var score=tokens.reduce(function(acc,t){
      return acc + (title.indexOf(t)!==-1?3:0) + (body.indexOf(t)!==-1?1:0);
    },0);
    scored.push({ page:d.page, module:d.module, id:d.id, title:d.title, text:d.text, score:score,
      snippet:makeSnippet(d.text||d.title,tokens) });
  });
  scored.sort(function(a,b){ return b.score-a.score; });
  scored=scored.slice(0,40);
  if(!scored.length){
    openModal('搜索「'+q+'」','<div class="modal-body">未找到与『'+esc(q)+'』相关的内容。</div>'+
      '<p class="hint">换个更短的关键词试试；多个词用空格分开时需要全部命中。</p>',{cls:'narrow'});
    return;
  }
  var body='<p class="hint" style="margin:-2px 0 10px;color:#8a8a93;font-size:12.3px">共 '+scored.length+' 条，点击结果才跳转并定位卡片。</p>'+
    '<div class="res-list">'+scored.map(function(d){
      return '<button class="res-item" data-act="goto" data-page="'+d.page+'" data-id="'+esc(d.id)+'">'+
        '<div class="res-top"><span class="res-mod">'+esc(d.module)+'</span><span class="res-title">'+esc(d.title||'未命名')+'</span></div>'+
        '<div class="res-snip">'+esc(d.snippet)+'</div>'+
      '</button>';
    }).join('')+'</div>';
  openModal('搜索「'+q+'」',body,{cls:'wide'});
}

   ============================================================ */
var SYNC={
  token:function(){ return localStorage.getItem('syncGithubToken')||''; },
  user:function(){ return localStorage.getItem('syncGithubUser')||''; },
  repo:function(){ var u=this.user(); return u?u+'.github.io':''; },
  enabled:function(){ return !!(this.token()&&this.user()); },
  headers:function(){
    return {
      'Authorization':'Bearer '+this.token(),
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'
    };
  },
  path:function(){
    return 'https://api.github.com/repos/'+encodeURIComponent(this.user())+'/'+encodeURIComponent(this.repo())+'/contents/userData.json';
  }
};

function b64enc(str){
  var bytes=new TextEncoder().encode(str);
  var bin='';
  var chunk=0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  }
  return btoa(bin);
}
function b64dec(b64){
  var bin=atob(String(b64||'').replace(/\s+/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var syncTimer=null;
function scheduleSync(){
  if(!SYNC.enabled()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){ cloudPush(true); },700);
}

function updateSyncBtn(){
  var btn=document.getElementById('syncBtn');
  if(!btn) return;
  btn.classList.toggle('on',SYNC.enabled());
  btn.title=SYNC.enabled()?('已开启同步 · '+SYNC.user()+'/'+SYNC.repo()):'把个人数据备份到自己的 GitHub 仓库';
}

function cloudPush(silent){
  if(!SYNC.enabled()){ if(!silent) openSyncModal(); return Promise.resolve(false); }
  var payload={};
  SYNC_KEYS.forEach(function(k){ payload[k]=Storage.get(k,defaultFor(k)); });
  var body={
    message:'sync userData.json '+new Date().toISOString(),
    content:b64enc(JSON.stringify(payload,null,2))
  };
  function getSha(){
    return fetch(SYNC.path(),{headers:SYNC.headers(),cache:'no-store'}).then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json().then(function(j){ return j.sha||null; });
    });
  }
  function put(){
    return fetch(SYNC.path(),{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'},SYNC.headers()),
      body:JSON.stringify(body)
    });
  }
  return getSha().then(function(sha){
    if(sha) body.sha=sha;
    return put();
  }).then(function(r){
    if(r.status===409){
      return getSha().then(function(sha2){
        if(sha2) body.sha=sha2;
        return put();
      }).then(function(r2){
        if(!r2.ok) throw new Error('HTTP '+r2.status);
      });
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
  }).then(function(){
    localStorage.setItem('syncLastAt',String(Date.now()));
    if(!silent) toast('已推送到云端');
    return true;
  }).catch(function(err){
    if(!silent) toast('推送失败：'+(err&&err.message?err.message:'网络错误'));
    return false;
  });
}

function cloudPull(silent){
  if(!SYNC.enabled()){ if(!silent) openSyncModal(); return Promise.resolve(false); }
  return fetch(SYNC.path(),{headers:SYNC.headers(),cache:'no-store'}).then(function(r){
    if(r.status===404){ if(!silent) toast('云端还没有 userData.json，先点「立即推送」'); return false; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json().then(function(j){
      var data={};
      try{ data=JSON.parse(b64dec(j.content||'')); }catch(e){ throw new Error('云端数据解析失败'); }
      SYNC_KEYS.forEach(function(k){
        var v=data[k];
        if(v===null||v===undefined) v=defaultFor(k);
        if(typeof v!=='object') v=defaultFor(k);
        try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
      });
      localStorage.setItem('syncLastAt',String(Date.now()));
      render(); updateSyncBtn();
      if(!silent) toast('已从云端拉取个人数据');
      return true;
    });
  }).catch(function(err){
    if(!silent) toast('拉取失败：'+(err&&err.message?err.message:'网络错误'));
    return false;
  });
}

function openSyncModal(){
  var last=localStorage.getItem('syncLastAt');
  openModal('☁ 云端同步（可选）',

    '<div class="field"><label for="syncToken">fine-grained Token（只勾该仓库 Contents 读写）</label>'+

    '<div class="modal-foot">'+

      '<button class="btn ghost" data-act="sync-pull">从云端拉取</button>'+
